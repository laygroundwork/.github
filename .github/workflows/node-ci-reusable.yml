# Reusable CI workflow for laygroundwork repos — Node path.
#
# ─── Charter ────────────────────────────────────────────────────────────
# One reusable, one concern: build + test a single Node workspace.
# Companions: `shell-ci-reusable.yml` (shellcheck) + `secret-scan-reusable.yml`
# (gitleaks). Callers compose them as two/three jobs.
#
# Split history: pre-v2 this file routed Node OR shell via `inputs.lang`
# and bundled gitleaks as a second job. v2 (GW-292, 2026-05-22) split it
# into three focused reusables after the charter tripwire fired at 8
# inputs + 8 lang-gated steps. v1 callers still pin `@v1` and read the
# monolith from that tag's commit; new callers move to `@node-ci-v2`.
#
# Tripwire (re-watch): if input count exceeds ~8 or any `if:` expression
# on a step gates more than 2 steps, split again before adding more.
#
# ─── Versioning ─────────────────────────────────────────────────────────
# Callers MUST pin to a tag (`@node-ci-v2` or later), not `@main`. `@main`
# is a blast-radius footgun: a bad merge here instantly breaks every
# caller. Tags are cut from main after CODEOWNERS-required review.
#
# ─── Branch-protection contract ─────────────────────────────────────────
# Job ID `build-test` is stable across the split. GitHub Actions appends
# the matrix value, so the names required in branch protection are:
#   - `ci / build-test (ubuntu-latest)`
#   - `ci / build-test (macos-latest)`  (only when run-on-macos: true)
# Branch-protection rules require the *display name* (job ID + matrix
# value), not the bare job ID. Callers preserve `build-test` as the job
# ID in their `jobs.<id>.uses:` block so the name is uniform across the
# org. Companion `secret-scan-reusable.yml` preserves `secret-scan`.
# See PLATFORM_PLAN.md §7 for the full required-check list.
#
# ─── Permissions ────────────────────────────────────────────────────────
# Job-level (not workflow-level). Workflow-level permissions in a
# reusable become a CEILING for callers — at job level they're a FLOOR.
# Callers that need elevated scopes (e.g. `id-token: write` for OIDC,
# `packages: write` for GHCR) declare them at their own `jobs.<id>.uses:`
# block; those compose with the `contents: read` defined here.
#
# ─── Concurrency ────────────────────────────────────────────────────────
# Concurrency is NOT set here. It belongs in the caller's ci.yml so the
# group key (`${{ github.ref }}` / `${{ github.head_ref }}`) evaluates
# in the caller's repo context.
#
# ─── Slack failure notify ───────────────────────────────────────────────
# Failure-only Slack notify (GW-293). Hardened per gw292-reusable-split
# design-review (2026-05-22):
#   - Skips fork-PRs (belt-and-braces with GitHub's default secret-withhold).
#   - Graceful no-op when SLACK_ALERTS_WEBHOOK secret unset.
#   - Webhook URL regex-allowlisted before curl.
#   - Repo/SHA sanitized before payload interpolation.
#   - `curl --fail` (no `|| true`); stderr suppressed to prevent URL echo
#     into logs (curl's error body can include the path).
#   - `set +x` defensively so ACTIONS_STEP_DEBUG can't expand the secret.

name: node-ci-reusable

on:
  workflow_call:
    inputs:
      run-on-macos:
        description: "Also run on macos-latest. ~10x ubuntu cost — only opt in if the repo has macOS-specific code paths or ships a macOS binary."
        type: boolean
        default: false
      node-version:
        description: "Node.js version. Ignored when node-version-file is set."
        type: string
        default: "20"
      node-version-file:
        description: "Path (relative to working-directory) to a file containing the Node version (e.g. '.nvmrc', '.node-version', 'package.json'). When non-empty, takes precedence over node-version. Use this when the repo's Dockerfile / dev environment already reads .nvmrc — keeps one source of truth."
        type: string
        default: ""
      working-directory:
        description: "Path (relative to repo root) where package.json lives. Default '.' for single-app repos; set to e.g. 'apps/mcp' for monorepo workspaces. Applied to npm ci/build/test/lint, artifact upload path, and node-version-file resolution."
        type: string
        default: "."
      install-ignore-scripts:
        description: "Pass --ignore-scripts to npm ci. Blocks dependency lifecycle hooks (preinstall, postinstall, prepare) — defense-in-depth against fork-PR RCE via a malicious dep's lifecycle script. Default false because some legitimate deps (esbuild, inngest-cli, protobufjs) use postinstall to download binaries or build native bindings. Opt in for repos whose deps don't depend on lifecycle hooks."
        type: boolean
        default: false
      timeout-minutes:
        description: "Per-job timeout. Default 15 (well above current caller runs of <5 min). Hard-capped at 30 — a malicious caller cannot wedge a runner for hours."
        type: number
        default: 15
      notify-failures:
        description: "Post a failure notification to Slack via SLACK_ALERTS_WEBHOOK on red builds. Default true. Set false to silence (e.g., during a known-flaky migration). Step is a graceful no-op when the secret is unset."
        type: boolean
        default: true
    secrets:
      SLACK_ALERTS_WEBHOOK:
        description: "Slack incoming-webhook URL for #bb-alerts. Caller passes via explicit pass-through in its `secrets:` block (NOT `secrets: inherit`). See dot-github/.github/workflows/smoke-v2.yml for example."
        required: false

jobs:
  build-test:
    name: build-test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.run-on-macos && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Hard-cap caller-supplied timeout-minutes at 30. Default is 15 (set
    # at the input level); the cap lives here so a caller can't ask for
    # 360. timeout-minutes: 0 also returns 30 because 0 is falsy in GH
    # Actions expressions and trips the `||` fallback.
    timeout-minutes: ${{ inputs.timeout-minutes <= 30 && inputs.timeout-minutes || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # node-version-file wins when set; otherwise node-version.
          # Passing empty string for the unused input causes setup-node
          # to treat it as not provided.
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file != '' && format('{0}/{1}', inputs.working-directory, inputs.node-version-file) || '' }}
          cache: npm
          cache-dependency-path: ${{ format('{0}/package-lock.json', inputs.working-directory) }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: npm ci ${{ inputs.install-ignore-scripts && '--ignore-scripts' || '' }}

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: npm run build

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: npm test

      - name: Lint (optional)
        working-directory: ${{ inputs.working-directory }}
        run: npm run lint --if-present

      - name: Upload build artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ${{ format('{0}/dist/', inputs.working-directory) }}
          if-no-files-found: ignore

      - name: Slack failure notify
        if: ${{ failure() && !cancelled() && inputs.notify-failures }}
        env:
          SLACK_ALERTS_WEBHOOK: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_FORK_HEAD: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set +x
          set -eo pipefail

          # Fork-PR guard. GitHub withholds secrets from fork PRs by default
          # for `pull_request`, but `pull_request_target` would leak them.
          # Belt-and-braces.
          if [ "$GH_EVENT_NAME" = "pull_request" ] && [ -n "$GH_FORK_HEAD" ] && [ "$GH_FORK_HEAD" != "$GH_REPO" ]; then
            echo "fork-PR detected; skip notify"
            exit 0
          fi

          # Graceful no-op when the org hasn't configured the webhook yet.
          if [ -z "${SLACK_ALERTS_WEBHOOK:-}" ]; then
            echo "SLACK_ALERTS_WEBHOOK unset; skip notify"
            exit 0
          fi

          # Allowlist webhook URL shape. Even though it comes from a secret
          # today, belt-and-braces against future drift to per-caller or
          # per-tenant config.
          if ! [[ "$SLACK_ALERTS_WEBHOOK" =~ ^https://hooks\.slack\.com/services/[A-Za-z0-9/]+$ ]]; then
            echo "SLACK_ALERTS_WEBHOOK fails URL allowlist; skip notify"
            exit 0
          fi

          # Sanitize repo string (defense vs. attacker-chosen Slack markdown
          # via fork branch names) before payload interpolation.
          REPO_CLEAN=$(printf '%s' "$GH_REPO" | tr -cd 'a-zA-Z0-9/_.-')
          SHA_SHORT=$(printf '%s' "$GH_SHA" | cut -c1-7)
          PAYLOAD=$(jq -n \
            --arg repo "$REPO_CLEAN" \
            --arg sha "$SHA_SHORT" \
            --arg url "$GH_RUN_URL" \
            '{text: (":x: CI failure in `\($repo)` (commit `\($sha)`): \($url)")}')

          # stderr suppressed: curl --fail's error body can include URL path.
          # The URL is a registered secret so GH redacts the exact string,
          # but belt-and-braces.
          curl --fail --silent --show-error --max-time 10 \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            -o /dev/null \
            "$SLACK_ALERTS_WEBHOOK" 2>/dev/null
