# Reusable CI workflow consumed by every laygroundwork repo's
# `.github/workflows/ci.yml`. Filename is `node-ci-reusable.yml` for
# historical reasons (matches PLATFORM_PLAN.md §5 tree); the workflow
# now handles both Node and shell-only repos.
#
# Job naming is preserved across `lang` modes so PLATFORM_PLAN.md §7's
# branch-protection snippet (which requires `ci / build-test` and
# `ci / secret-scan`) keeps working regardless of the consumer's lang.
# A shell-only repo runs shellcheck inside the `build-test` job rather
# than emitting a separately-named check — same status name, same
# branch-protection contract.
name: node-ci-reusable

on:
  workflow_call:
    inputs:
      lang:
        description: "'node' (default) → npm build/test; 'shell' → shellcheck on tracked *.sh files. lang: shell requires at least one tracked .sh file or CI fails."
        type: string
        default: "node"
      run-on-macos:
        description: "Also run on macos-latest. Only effective when lang == 'node' (shellcheck on macOS is unsupported here)."
        type: boolean
        default: false
      node-version:
        description: "Node.js version. Only used when lang == 'node'."
        type: string
        default: "20"
      shellcheck-severity:
        description: "shellcheck --severity: error | warning | info | style. Default 'error' for safe rollout; tighten per-repo as scripts are cleaned up."
        type: string
        default: "error"

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS only when explicitly opted in AND lang is node. Shell-only
        # repos run on ubuntu-latest where shellcheck is preinstalled; the
        # macOS runner image doesn't ship shellcheck by default.
        os: ${{ fromJSON(inputs.lang == 'node' && inputs.run-on-macos && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ─── Node path ─────────────────────────────────────────────────────
      - name: Setup Node.js
        if: inputs.lang == 'node'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        if: inputs.lang == 'node'
        run: npm ci

      - name: Build
        if: inputs.lang == 'node'
        run: npm run build

      - name: Test
        if: inputs.lang == 'node'
        run: npm test

      - name: Lint (optional)
        if: inputs.lang == 'node'
        run: npm run lint --if-present

      - name: Upload build artifact
        if: inputs.lang == 'node' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: ignore

      # ─── Shell path ────────────────────────────────────────────────────
      - name: Show shellcheck version
        if: inputs.lang == 'shell'
        run: shellcheck --version

      - name: Run shellcheck on tracked *.sh files
        if: inputs.lang == 'shell'
        shell: bash
        run: |
          set -euo pipefail
          # `git ls-files` respects .gitignore + submodule boundaries
          # automatically, avoiding the find-traversal-into-node_modules
          # / vendored-deps trap and dropping the need for find -prune.
          mapfile -t FILES < <(git ls-files '*.sh' | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "lang: shell requires at least one tracked *.sh file; none found."
            exit 1
          fi
          echo "Linting ${#FILES[@]} file(s) with --severity=${{ inputs.shellcheck-severity }}:"
          printf '  %s\n' "${FILES[@]}"
          shellcheck --severity="${{ inputs.shellcheck-severity }}" "${FILES[@]}"

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
