# Reusable CI workflow for laygroundwork repos — gitleaks secret scan.
#
# ─── Charter ────────────────────────────────────────────────────────────
# Single concern: scan a repo's full git history for secrets with
# gitleaks. Companion to `node-ci-reusable.yml` (build+test) and
# `shell-ci-reusable.yml` (shellcheck). Created GW-292 (2026-05-22).
#
# ─── Versioning ─────────────────────────────────────────────────────────
# Callers pin a tag (`@secret-scan-v1` or later), not `@main`.
#
# ─── Branch-protection contract ─────────────────────────────────────────
# Job ID `secret-scan` is stable across the split. Display name:
# `ci / secret-scan`. PLATFORM_PLAN.md §7 lists it as a required check.
#
# ─── Slack failure notify ───────────────────────────────────────────────
# Defaults to OFF for secret-scan. Gitleaks failures are author-actionable
# (the author committed a secret) and don't need an on-call page. Callers
# can opt in by passing `notify-failures: true` if they want the noise.
# Design-review verdict for gw292-reusable-split: alarm-fatigue beats
# security signal here — the PR is already blocked from merging by the
# red check.
#
# ─── Supply-chain ───────────────────────────────────────────────────────
# We invoke the gitleaks OSS binary directly instead of using
# gitleaks/gitleaks-action. The action v2+ requires a paid license for
# any organization-owned repo (the OSS binary itself remains free).
# Pinning the binary's release tag + verifying its sha256 against the
# published checksums file gives us the same supply-chain guarantee as
# a SHA-pinned action, without the licensing entanglement. Bump
# GITLEAKS_VERSION / _SHA256 together when a new release is needed; the
# sha line lives at
# https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt

name: secret-scan-reusable

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Per-job timeout. Default 10 (gitleaks on a full-history clone of any laygroundwork repo lands in <2 min today). Hard-capped at 30."
        type: number
        default: 10
      notify-failures:
        description: "Post a failure notification to Slack via SLACK_ALERTS_WEBHOOK on red builds. Default false — gitleaks failures are author-actionable. Opt in per-caller if needed."
        type: boolean
        default: false
    secrets:
      SLACK_ALERTS_WEBHOOK:
        description: "Slack incoming-webhook URL for #bb-alerts. Caller passes via explicit pass-through in its `secrets:` block (NOT `secrets: inherit`). See dot-github/.github/workflows/smoke-v2.yml for example."
        required: false

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.timeout-minutes <= 30 && inputs.timeout-minutes || 30 }}
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gitleaks binary (sha256-verified)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o gitleaks.tar.gz "$URL"
          ACTUAL=$(sha256sum gitleaks.tar.gz | awk '{print $1}')
          if [ "$ACTUAL" != "$GITLEAKS_SHA256" ]; then
            echo "gitleaks tarball sha256 mismatch:"
            echo "  expected: $GITLEAKS_SHA256"
            echo "  actual:   $ACTUAL"
            exit 1
          fi
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact --exit-code 1 --verbose

      - name: Slack failure notify
        if: ${{ failure() && !cancelled() && inputs.notify-failures }}
        env:
          SLACK_ALERTS_WEBHOOK: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_FORK_HEAD: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set +x
          set -eo pipefail

          if [ "$GH_EVENT_NAME" = "pull_request" ] && [ -n "$GH_FORK_HEAD" ] && [ "$GH_FORK_HEAD" != "$GH_REPO" ]; then
            echo "fork-PR detected; skip notify"
            exit 0
          fi
          if [ -z "${SLACK_ALERTS_WEBHOOK:-}" ]; then
            echo "SLACK_ALERTS_WEBHOOK unset; skip notify"
            exit 0
          fi
          if ! [[ "$SLACK_ALERTS_WEBHOOK" =~ ^https://hooks\.slack\.com/services/[A-Z0-9/]+$ ]]; then
            echo "SLACK_ALERTS_WEBHOOK fails URL allowlist; skip notify"
            exit 0
          fi

          REPO_CLEAN=$(printf '%s' "$GH_REPO" | tr -cd 'a-zA-Z0-9/_.-')
          SHA_SHORT=$(printf '%s' "$GH_SHA" | cut -c1-7)
          PAYLOAD=$(jq -n \
            --arg repo "$REPO_CLEAN" \
            --arg sha "$SHA_SHORT" \
            --arg url "$GH_RUN_URL" \
            '{text: (":lock: secret-scan failure in `\($repo)` (commit `\($sha)`): \($url)")}')

          curl --fail --silent --show-error --max-time 10 \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            -o /dev/null \
            "$SLACK_ALERTS_WEBHOOK" 2>/dev/null
